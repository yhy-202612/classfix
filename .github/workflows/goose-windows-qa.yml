name: Desktop Goose Windows QA

on:
  push:
    branches:
      - codex/goose-windows-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-2025
    timeout-minutes: 18
    defaults:
      run:
        working-directory: client
    env:
      QT_ACCESSIBILITY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install Windows build and GUI test dependencies
        run: |
          python -m pip install -r requirements-build.txt pillow pywinauto
      - name: Set up the official Goose
        run: |
          $env:EVETECH_DATA_DIR = Join-Path $env:RUNNER_TEMP 'eve-goose-qa'
          $env:QA_REPORT = Join-Path $env:RUNNER_TEMP 'eve-goose-report'
          "EVETECH_DATA_DIR=$env:EVETECH_DATA_DIR" >> $env:GITHUB_ENV
          "QA_REPORT=$env:QA_REPORT" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:QA_REPORT | Out-Null
          python goose_setup.py --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from evetech.storage import Store,data_directory; Store(data_directory()).update_settings({'startup_prompted':'1','monitor_enabled':'0','update_check':'0','theme':'dark'})"
      - name: Build the native Windows distribution
        run: |
          $gooseFolder = Join-Path $env:EVETECH_DATA_DIR 'desktop-goose\v0.31'
          .\build-exe.ps1 -Python python.exe -DesktopGooseFolder $gooseFolder
      - name: Click Preview Goose in the packaged app and verify the screen pixels
        run: |
          Get-Process -Id $PID | Select-Object ProcessName,SessionId
          python tools/windows-qa/preview.py dist/EveTech/EveTech.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-goose-preview-evidence
          path: ${{ runner.temp }}/eve-goose-report
          if-no-files-found: warn
          retention-days: 7
